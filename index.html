<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Videojuegos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-900 text-white">
    <header class="bg-gray-800 p-4 text-center text-xl font-bold">Tienda de Videojuegos</header>
    <main class="container mx-auto p-6">
        <section class="mb-6">
            <h2 class="text-2xl font-semibold mb-4">Destacados - Últimos GOTY</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="bg-gray-700 p-4 rounded-lg">
                    <img src="https://cdn1.epicgames.com/offer/3ddd6a590da64e3686042d108968a6b2/EGS_GodofWar_SantaMonicaStudio_S2_1200x1600-fbdf3cbc2980749091d52751ffabb7b7_1200x1600-fbdf3cbc2980749091d52751ffabb7b7" alt="God of War Ragnarok" class="w-full rounded">
                    <h3 class="mt-2 text-lg font-semibold">God of War Ragnarok (2022)</h3>
                    <p class="text-sm text-gray-300">$59.99</p>
                    <button class="mt-2 bg-blue-600 hover:bg-blue-700 text-white py-1 px-3 rounded">Comprar</button>
                </div>
                <div class="bg-gray-700 p-4 rounded-lg">
                    <img src=" https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo01EGiq0O6HKlXwn-MSQEDcdcyiuuyLcrzkWxhG5PFzc6Cq2HcJmh99NdABTnsCG5-GGZwPDUDKslysRweNr46HwnrjkxtaeazT_vm34 " alt="Elden Ring" class="w-full rounded">
                    <h3 class="mt-2 text-lg font-semibold">Elden Ring (2022)</h3>
                    <p class="text-sm text-gray-300">$49.99</p>
                    <button class="mt-2 bg-blue-600 hover:bg-blue-700 text-white py-1 px-3 rounded">Comprar</button>
                </div>
                <div class="bg-gray-700 p-4 rounded-lg">
                    <img src="https://upload.wikimedia.org/wikipedia/en/8/8a/Baldur%27s_Gate_3_cover_art.jpg" alt="Baldur's Gate 3" class="w-full rounded">
                    <h3 class="mt-2 text-lg font-semibold">Baldur's Gate 3 (2023)</h3>
                    <p class="text-sm text-gray-300">$69.99</p>
                    <button class="mt-2 bg-blue-600 hover:bg-blue-700 text-white py-1 px-3 rounded">Comprar</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
